version: '3.8'

services:
  postgres-db:
    image: postgres:17
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d content" ]
      interval: 3s
      timeout: 3s
      retries: 5
    container_name: spring-postgres-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1111
      POSTGRES_DB: content
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    container_name: spring-app-container
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/content
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  pgdata: